<!DOCTYPE html>
<html lang="en" data-theme="blue">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Static x Eshay</title>
<style>
/* Fonts via STATIC_INTER_FONT_CSS (Inter VF + FA subset). */
html,body,.PWrapper{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;font-optical-sizing:auto;}
    :root {
        --menu-color: 22, 137, 212;
        --menu-x: 4.5%;
        --menu-y: 26%;
        --menu-scale: 1;
        --resolution-scale: 1;
        --menu-radius: .35vw;
        --menu-bg: rgba(8, 8, 12, 0.95);
        --menu-border: rgba(255,255,255,0.06);
        --text-primary: rgba(255,255,255,0.92);
        --text-secondary: rgba(255,255,255,0.55);
        --surface: rgba(255,255,255,0.04);
        --surface-hover: rgba(255,255,255,0.07);
        --surface-active: rgba(255,255,255,0.02);
        /* Row label/icon centering is handled by flex — keep nudge at 0. */
        --text-nudge: 0;
        --ctrl-nudge: 0;
    }

    /* DUI already sizes with vw — do not auto-shrink (DPR * width falsely hits 4K). */

    *, *::before, *::after { box-sizing: border-box; }

    .Desc {
        position: absolute; display: flex; left: 50%; bottom: 4vw;
        transform: translate(-50%); width: auto; height: 1.3vw;
        background: rgba(8,8,12,0.96); border-radius: .26vw;
        padding: 0 1vw; font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 400;
        font-size: .62vw; color: var(--text-secondary);
        justify-content: center; align-items: center;
        border: .06vw solid rgba(var(--menu-color),0.2);
        white-space: nowrap;
    }

    .menu-loading {
        display: flex; justify-content: center; align-items: center;
        width: 100%; min-height: 2.4vw; padding: .8vw 0;
        font-size: .58vw; font-weight: 500; letter-spacing: .04em;
        color: rgba(var(--menu-color), 0.85);
        text-transform: uppercase;
    }

    .PWrapper {
        position: absolute; display: flex;
        width: 19.0104vw;
        left: var(--menu-x); top: var(--menu-y);
        transform: translate(0%,0%) scale(calc(var(--menu-scale) * var(--resolution-scale)));
        transform-origin: top left;
        justify-content: flex-start; align-items: stretch;
        flex-direction: column; font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        filter: drop-shadow(0 .6vw 1.8vw rgba(0,0,0,0.6));
        box-sizing: border-box;
    }

    .PWrapper .PElements {
        position: relative; display: flex;
        width: 100%;
        justify-content: flex-start; align-items: stretch;
        flex-direction: row; gap: 0;
        box-sizing: border-box;
    }

    .PWrapper .PElements .PScroll {
        position: absolute; display: flex;
        left: -.95vw;
        top: 0;
        bottom: 0;
        width: .62vw; height: auto;
        justify-content: space-between; align-items: center;
        flex-direction: column; gap: .12vw;
        padding: .1vw 0;
        box-sizing: border-box;
        z-index: 2;
        overflow: visible;
    }

    /* arrow caps — small framed buttons top and bottom */
    .PWrapper .PElements .PScroll i {
        display: flex; justify-content: center; align-items: center;
        width: .62vw; height: .62vw; flex-shrink: 0;
        font-size: .44vw; color: rgba(255,255,255,0.35);
        background: rgba(255,255,255,0.04);
        border-radius: .16vw;
        transition: color .15s ease, background .15s ease;
        overflow: visible;
        line-height: 1;
    }

    .PWrapper .PElements .PScroll:hover i {
        color: rgb(var(--menu-color));
        background: rgba(var(--menu-color),0.14);
    }

    /* recessed capsule track */
    .PWrapper .PElements .PScroll .PSProgressWrapper {
        position: relative; display: flex;
        width: .34vw; flex: 1 1 auto; margin: .12vw 0;
        background: rgba(0,0,0,0.35);
        border-radius: 1vw;
        box-shadow: inset 0 0 0 .04vw rgba(255,255,255,0.05),
                    inset 0 .06vw .12vw rgba(0,0,0,0.6);
        justify-content: center; align-items: flex-start;
        overflow: hidden;
    }

    /* solid capsule thumb — absolute so top/height % sit in the track (not a thin offset stripe) */
    .PWrapper .PElements .PScroll .PSProgress {
        position: absolute; display: block;
        left: 0; right: 0; width: 100%;
        min-height: .5vw;
        background: linear-gradient(180deg,
            rgba(var(--menu-color),1) 0%,
            rgba(var(--menu-color),0.75) 100%);
        border-radius: 1vw;
        box-shadow: inset 0 .06vw 0 rgba(255,255,255,0.35);
        transition: top .2s ease, height .2s ease, background .15s ease;
        box-sizing: border-box;
    }

    .PWrapper .PElements .PScroll:hover .PSProgress {
        background: rgb(var(--menu-color));
    }

    .PWrapper .PElements .PRightElements {
        position: relative; display: flex;
        width: 100%;
        max-width: 100%;
        justify-content: flex-start; align-items: stretch;
        flex-direction: column;
        box-sizing: border-box;
        overflow: visible;
        background: transparent;
        border: none;
        border-radius: 0;
        gap: .08vw;
    }

    .PWrapper .PBanner {
        position: relative; display: flex;
        width: 100%; min-width: 100%; height: 6.5vw;
        justify-content: center; align-items: center;
        border-top-left-radius: var(--menu-radius);
        border-top-right-radius: var(--menu-radius);
        overflow: hidden; flex-shrink: 0;
        background: #001a1a;
        box-sizing: border-box;
        margin: 0 0 .08vw 0;
    }

    .PWrapper .PBanner img {
        position: absolute; width: 100%; height: 100%;
        object-fit: cover; object-position: center;
    }

    .PWrapper .PBanner iframe {
        position: absolute; width: 300%; height: 160%;
        border: none; pointer-events: none; top: -30%; left: -100%;
    }

    .PWrapper .PBanner .CustomBanner {
        position: absolute; width: 100%; height: 100%;
        min-width: 100%; min-height: 100%;
        display: flex; justify-content: center; align-items: center;
        overflow: hidden; flex-shrink: 0;
    }

    .PWrapper .PBanner .CustomBanner .ESHAYText {
        position: relative; font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        font-weight: 800; font-size: 3.5vw;
        letter-spacing: 0.4vw; z-index: 2;
        text-transform: uppercase; text-align: center; line-height: 1.2;
    }

    .PWrapper .PBanner .CustomBanner.theme-neon {
        background: linear-gradient(135deg, #001a1a 0%, #003333 50%, #001a1a 100%);
        background-size: 100% 100%;
    }
    .PWrapper .PBanner .CustomBanner.theme-neon .ESHAYText {
        color: #00ffff;
        text-shadow: 0 0 10px rgba(0,255,255,0.8),0 0 20px rgba(0,255,255,0.6),0 0 30px rgba(0,255,255,0.4),0 2px 4px rgba(0,0,0,0.3);
    }

    .PWrapper .PBanner .CustomBanner.theme-minimal {
        background: linear-gradient(135deg, #f8f8f8 0%, #ffffff 50%, #f8f8f8 100%);
        background-size: 100% 100%;
    }
    .PWrapper .PBanner .CustomBanner.theme-minimal .ESHAYText {
        color: #1a1a1a;
        text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        font-weight: 900;
    }

    .PWrapper .PBanner .CustomBanner.theme-glitch {
        background: linear-gradient(135deg, #001100 0%, #003300 50%, #001100 100%);
        background-size: 100% 100%;
    }
    .PWrapper .PBanner .CustomBanner.theme-glitch .ESHAYText {
        color: #00ff88;
        text-shadow: 0 0 8px rgba(0,255,136,0.7),0 0 16px rgba(0,255,136,0.5),0 0 24px rgba(0,255,136,0.3),0 2px 4px rgba(0,0,0,0.3);
    }

    .PWrapper .PBanner .CustomBanner.theme-retro {
        background: linear-gradient(135deg, #ff8c42 0%, #ffa559 50%, #ff8c42 100%);
        background-size: 100% 100%;
    }
    .PWrapper .PBanner .CustomBanner.theme-retro .ESHAYText {
        color: #fff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        font-weight: 900;
    }

    .PWrapper .PBanner .CustomBanner.theme-cyber {
        background: linear-gradient(135deg, #000814 0%, #001d3d 50%, #000814 100%);
        background-size: 100% 100%;
    }
    .PWrapper .PBanner .CustomBanner.theme-cyber .ESHAYText {
        color: #64d9ff;
        text-shadow: 0 0 10px rgba(100,217,255,0.8),0 0 20px rgba(100,217,255,0.6),0 0 30px rgba(100,217,255,0.4),0 2px 4px rgba(0,0,0,0.3);
    }

    .PWrapper .PCategories {
        position: relative; display: flex;
        width: 100%; height: 1.6vw;
        margin: 0 0 .08vw 0;
        justify-content: center; align-items: center;
        flex-direction: row;
        background: rgba(0,0,0,0.82);
        border-radius: calc(var(--menu-radius) * .6);
        border: .06vw solid var(--menu-border);
        overflow: hidden;
        box-sizing: border-box;
    }

    .PWrapper .PCategories:has(.PCategory:only-child) {
        justify-content: flex-start;
    }

    .PWrapper .PCategories .PCategory {
        position: relative; display: flex; flex: 1;
        text-align: center; height: 100%;
        justify-content: center; align-items: center;
        font-size: .6vw; font-weight: 500;
        color: var(--text-secondary);
        letter-spacing: .03vw;
        cursor: pointer;
        transition: color .2s ease, background .25s ease;
        box-sizing: border-box;
    }
    .PWrapper .PCategories .PCategory > span {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        line-height: 1;
        transform: none;
        box-sizing: border-box;
    }

    .PWrapper .PCategories .PCategory:hover {
        color: rgba(255,255,255,0.82);
        background: rgba(255,255,255,0.03);
    }

    .PWrapper .PCategories .PCategory.active {
        color: #fff;
        background: linear-gradient(0deg, rgba(var(--menu-color),0.16) 0%, transparent 100%);
    }

    .PWrapper .PCategories .PCategory.active::after {
        content: ''; position: absolute; bottom: 0;
        left: 18%; width: 64%; height: .12vw;
        background: linear-gradient(90deg,
            rgba(var(--menu-color),0.4) 0%,
            rgb(var(--menu-color)) 50%,
            rgba(var(--menu-color),0.4) 100%);
        border-radius: .1vw .1vw 0 0;
        box-shadow: 0 0 .6vw rgba(var(--menu-color),0.5);
    }

    /* Single tab (e.g. Main): same visual weight as a multi-tab cell (~1/3), not tiny left text. */
    .PWrapper .PCategories .PCategory:only-child {
        position: relative;
        left: auto;
        flex: 0 0 33.333%;
        width: 33.333%;
        max-width: 33.333%;
        padding: 0;
        justify-content: center;
        text-align: center;
        font-size: .6vw;
        font-weight: 450;
    }

    .PWrapper .PCategories .PCategory:last-child { border-right: none; }

    .PWrapper .PTabs {
        position: relative; display: flex;
        width: 100%; height: auto;
        max-height: 14.0625vw;
        justify-content: flex-start; align-items: stretch;
        flex-direction: column;
        background: var(--menu-bg);
        border: .06vw solid var(--menu-border);
        border-radius: var(--menu-radius);
        /* Clip selection bubble to the panel curve so top/bottom rows sit flush */
        overflow: hidden;
        padding: 0;
        box-sizing: border-box;
        box-shadow:
            inset 0 .05vw .1vw rgba(255,255,255,0.02),
            0 .15vw .6vw rgba(0,0,0,0.4);
    }

    .PWrapper .PTabs .PTab {
        position: relative; display: flex;
        width: 100%;
        height: 1.6vw; min-height: 1.6vw; max-height: 1.6vw;
        justify-content: center; align-items: center;
        cursor: pointer;
        transition: background .15s ease;
        border-bottom: .04vw solid rgba(255,255,255,0.02);
        box-sizing: border-box;
        padding: 0;
        margin: 0;
        overflow: visible;
    }

    .PWrapper .PTabs .PTab:last-child {
        border-bottom: none;
    }

    .PWrapper .PTabs .PTab:hover {
        background: linear-gradient(90deg, rgba(var(--menu-color),0.1) 0%, rgba(255,255,255,0.01) 60%, transparent 100%);
    }

    .PWrapper .PTabs .PTab.red-row .PTLabel,
    .PWrapper .PTabs .PTab.red-row .PTLabel .PTText {
        color: #e54848 !important;
    }
    .PWrapper .PTabs .PTab.red-row.active .PTLabel,
    .PWrapper .PTabs .PTab.red-row.active .PTLabel .PTText {
        color: #fff !important;
    }
    .PWrapper .PTabs .PTab.red-row:hover {
        background: linear-gradient(90deg, rgba(229,72,72,0.14) 0%, rgba(255,255,255,0.01) 60%, transparent 100%);
    }

    .PWrapper .PTabs .PTab:active {
        background: rgba(255,255,255,0.02);
    }

    .PWrapper .PTabs .PTab .PTLabel {
        position: absolute; display: flex; align-items: center;
        left: .7vw; top: 0; bottom: 0; right: 8.1vw;
        width: auto; height: auto; max-width: none;
        font-size: .62vw; font-weight: 500; line-height: 1.15;
        color: rgba(255,255,255,0.92);
        /* Clip text on .PTText only — overflow:hidden here was slicing FA/SVG icons. */
        overflow: visible;
        white-space: nowrap;
        letter-spacing: .01vw;
        margin: 0; padding: 0; box-sizing: border-box;
        z-index: 2;
        pointer-events: none;
    }
    .PWrapper .PTabs .PTab .PTLabel .PTText {
        display: block;
        flex: 1 1 auto;
        min-width: 0;
        max-width: 100%;
        overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        font-size: .62vw;
        font-weight: 500;
        letter-spacing: .01vw;
        color: rgba(255,255,255,0.92);
        line-height: 1.15;
        transform: none;
        margin: 0; padding: 0;
        opacity: 1;
        visibility: visible;
    }

    .PWrapper .PTabs .PTab.active .PTLabel,
    .PWrapper .PTabs .PTab.active .PTLabel .PTText,
    .PWrapper .PTabs .PTTab--active .PTLabel {
        color: #fff;
    }

    .PWrapper .PTabs .PTab .PTDLabel {
        position: absolute; display: flex; left: .75vw;
        font-size: .58vw; color: var(--text-secondary);
    }

    .PWrapper .PTabs .PTab .PTLabel > .fa-solid,
    .PWrapper .PTabs .PTab .PTLabel > .ico {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex: 0 0 .72vw !important;
        width: .72vw !important;
        height: .72vw !important;
        margin: 0 .28vw 0 0 !important;
        padding: 0 !important;
        position: static !important;
        left: auto !important;
        right: auto !important;
        top: auto !important;
        bottom: auto !important;
        transform: none !important;
        line-height: 1 !important;
        font-size: .58vw !important;
        color: rgba(255,255,255,.72) !important;
        vertical-align: middle;
        transition: none;
        overflow: visible !important;
        box-sizing: border-box !important;
    }
    .PWrapper .PTabs .PTab .PTLabel > .ico svg {
        width: .58vw !important;
        height: .58vw !important;
        display: block;
        margin: 0;
        overflow: visible;
        stroke-width: 2.2;
    }

    .PWrapper .PTabs .PTab i.chev-right,
    .PWrapper .PTabs .PTab .chev-right {
        position: absolute; display: flex;
        right: .65vw;
        top: 50%;
        font-size: .58vw;
        color: var(--text-secondary);
        transform: translateY(-50%);
        line-height: 1;
        align-items: center;
        justify-content: center;
        transition: color .15s ease;
    }

    .PWrapper .PTabs .PTab .TOptions .chev-right {
        position: relative; right: auto; top: auto;
        transform: none;
        flex: 0 0 auto;
    }

    .PWrapper .PTabs .PTab .TOptions {
        position: absolute; display: flex;
        right: .65vw; top: 0; bottom: 0; height: 100%;
        width: 7.8125vw;
        justify-content: flex-end; align-items: center;
        flex-direction: row; gap: .5vw;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    .PWrapper .PTabs .PTab .TOptions .Scrollable {
        position: relative; display: flex;
        justify-content: flex-end; align-items: center;
        flex-direction: row; gap: .26vw;
        flex: 0 1 auto;
        max-width: 6.4vw;
        overflow: hidden;
        white-space: nowrap;
        font-size: .58vw; font-weight: 400;
        color: var(--text-primary);
        opacity: .8;
        transform: none;
    }

    .PWrapper .PTabs .PTab .TOptions .Checkbox {
        position: relative; display: flex;
        flex: 0 0 1.4vw;
        width: 1.4vw; height: .7vw;
        margin: 0;
        justify-content: flex-start; align-items: center;
        background: rgba(255,255,255,0.08);
        border-radius: 999vw;
        transition: background .2s ease, box-shadow .2s ease;
        cursor: pointer;
        transform: translateY(var(--ctrl-nudge));
    }

    .PWrapper .PTabs .PTab .TOptions .Checkbox.Checked {
        background: rgba(var(--menu-color), 0.8);
        box-shadow: 0 0 .35vw rgba(var(--menu-color),0.25);
    }

    .PWrapper .PTabs .PTab .TOptions .Checkbox.Checked .Inside { left: .82vw; }

    .PWrapper .PTabs .PTab .TOptions .Checkbox .Inside {
        position: absolute; display: flex;
        left: .1vw;
        width: .42vw; height: .42vw;
        background: #f0f0f0;
        border-radius: 999vw;
        box-shadow: 0 .04vw .08vw rgba(0,0,0,0.5);
        transition: left .2s cubic-bezier(.34,1.56,.64,1);
    }

    .PWrapper .PTabs .PTab .Checkbox {
        position: absolute; display: flex; right: .65vw;
        top: 50%;
        transform: translateY(-50%);
        width: 1.4vw; height: .7vw;
        justify-content: flex-start; align-items: center;
        background: rgba(255,255,255,0.08);
        border-radius: 999vw;
        transition: background .2s ease, box-shadow .2s ease;
        cursor: pointer;
    }

    .PWrapper .PTabs .PTab .Checkbox.Checked {
        background: rgba(var(--menu-color), 0.8);
        box-shadow: 0 0 .35vw rgba(var(--menu-color),0.25);
    }

    .PWrapper .PTabs .PTab .Checkbox.Checked .Inside { left: .82vw; }

    .PWrapper .PTabs .PTab .Checkbox .Inside {
        position: absolute; display: flex;
        left: .1vw;
        width: .42vw; height: .42vw;
        background: #f0f0f0;
        border-radius: 999vw;
        box-shadow: 0 .04vw .08vw rgba(0,0,0,0.5);
        transition: left .2s cubic-bezier(.34,1.56,.64,1);
    }

    .PWrapper .PTabs .PTab .TOptions .Slider {
        position: relative; display: flex;
        flex: 0 0 2.2vw;
        width: 2.2vw; height: .18vw;
        justify-content: flex-start; align-items: center;
        background: rgba(255,255,255,0.06);
        border-radius: .26vw;
        transform: translateY(var(--ctrl-nudge));
    }

    .PWrapper .PTabs .PTab .TOptions .Slider .Progress {
        position: absolute; display: flex; height: 100%;
        justify-content: center; align-items: center;
        background: linear-gradient(90deg,
            rgba(var(--menu-color),0.7) 0%, rgb(var(--menu-color)) 100%);
        border-radius: .26vw;
        box-shadow: 0 0 .3vw rgba(var(--menu-color),0.35);
    }

    .PWrapper .PTabs .PTab .TOptions .Slider .Progress .Thumb {
        position: absolute; display: flex; right: 0;
        width: .38vw; height: .38vw;
        background: #fff;
        border-radius: 999vw;
        box-shadow: 0 .04vw .1vw rgba(0,0,0,0.4), 0 0 .3vw rgba(var(--menu-color),0.5);
    }

    .PWrapper .PTabs .PTab .Slider {
        position: absolute; display: flex; right: .65vw;
        top: 50%;
        transform: translateY(-50%);
        width: 2.2vw; height: .18vw;
        justify-content: flex-start; align-items: center;
        background: rgba(255,255,255,0.06);
        border-radius: .26vw;
    }

    .PWrapper .PTabs .PTab .Slider .Progress {
        position: absolute; display: flex; height: 100%;
        justify-content: center; align-items: center;
        background: linear-gradient(90deg,
            rgba(var(--menu-color),0.7) 0%, rgb(var(--menu-color)) 100%);
        border-radius: .26vw;
        box-shadow: 0 0 .3vw rgba(var(--menu-color),0.35);
    }

    .PWrapper .PTabs .PTab .Slider .Progress .Thumb {
        position: absolute; display: flex; right: 0;
        width: .38vw; height: .38vw;
        background: #fff;
        border-radius: 999vw;
        box-shadow: 0 .04vw .1vw rgba(0,0,0,0.4), 0 0 .3vw rgba(var(--menu-color),0.5);
    }

    .PWrapper .PTabs .PTab .Scrollable {
        position: absolute; display: flex;
        right: .65vw;
        top: 0; bottom: 0;
        height: auto;
        justify-content: center; align-items: center;
        flex-direction: row; gap: .26vw;
        font-size: .58vw; font-weight: 400;
        line-height: 1.15;
        color: var(--text-primary);
        opacity: .8;
        transform: none;
        box-sizing: border-box;
    }
    .PWrapper .PTabs .PTab .Scrollable.with-checkbox {
        right: 2.35vw;
    }

    .PWrapper .PTabs .PTab .Divider {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        display: flex; width: 86%;
        justify-content: space-between; align-items: center;
        flex-direction: row; gap: .26vw;
        opacity: .4;
        pointer-events: none;
        transition: opacity .15s ease;
    }

    .PWrapper .PTabs .PTab:hover .Divider,
    .PWrapper .PTabs .PTab.active .Divider {
        opacity: .85;
    }

    .PWrapper .PTabs .PTab .Divider .Left,
    .PWrapper .PTabs .PTab .Divider .Right {
        position: relative; display: flex;
        flex: 1; height: .05vw;
        background: rgba(255,255,255,0.12);
        border-radius: 5vw;
    }

    .PWrapper .PTabs .PTab .Divider .Label {
        position: relative; display: flex;
        align-items: center;
        font-size: .55vw; font-weight: 500;
        color: var(--text-secondary);
        white-space: nowrap; padding: 0 .5vw;
        letter-spacing: .06vw;
        text-transform: uppercase;
        line-height: 1.2;
        transform: none;
    }

    .PWrapper .list-section-header {
        display: none;
        position: relative;
        width: 100%;
        height: 1.6vw;
        min-height: 1.6vw;
        max-height: 1.6vw;
        flex-shrink: 0;
        pointer-events: none;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        background: var(--menu-bg);
        border-left: .06vw solid var(--menu-border);
        border-right: .06vw solid var(--menu-border);
    }
    .PWrapper .list-section-header.show { display: flex; }
    .PWrapper .list-section-header .Divider {
        position: absolute; left: 50%; transform: translate(-50%);
        display: flex; width: 86%;
        justify-content: space-between; align-items: center;
        flex-direction: row; gap: .26vw;
        opacity: .4;
        pointer-events: none;
    }
    .PWrapper .list-section-header .Divider .Left,
    .PWrapper .list-section-header .Divider .Right {
        position: relative; display: flex;
        flex: 1; height: .05vw;
        background: rgba(255,255,255,0.12);
        border-radius: 5vw;
    }
    .PWrapper .list-section-header .Divider .Label {
        position: relative; display: flex;
        align-items: center;
        font-size: .55vw; font-weight: 500;
        color: var(--text-secondary);
        white-space: nowrap; padding: 0 .5vw;
        letter-spacing: .06vw;
        text-transform: uppercase;
        line-height: 1.2;
        transform: none;
    }

    .PWrapper .Metadata {
        position: absolute; display: none;
        width: 13.6vw; right: -15.4vw; top: 0;
        flex-direction: column;
        background:
            linear-gradient(180deg, rgba(var(--menu-color),0.14) 0%, transparent 28%),
            var(--menu-bg);
        border: .06vw solid rgba(var(--menu-color),0.28);
        border-radius: calc(var(--menu-radius) * 1.15);
        padding: .55vw .7vw .65vw;
        box-shadow:
            0 .45vw 1.5vw rgba(0,0,0,0.7),
            0 0 .8vw rgba(var(--menu-color),0.08),
            inset 0 .06vw 0 rgba(255,255,255,0.04);
        overflow: hidden;
        transform-origin: left center;
        z-index: 8;
        pointer-events: none;
    }

    .PWrapper .Metadata.show {
        display: flex;
        animation: MetaPop .16s cubic-bezier(.22,.8,.3,1) both;
    }

    /* thin accent line along the top edge, brightest at the left */
    .PWrapper .Metadata::before {
        content: ""; position: absolute;
        left: 0; right: 0; top: 0; height: .1vw;
        background: linear-gradient(90deg,
            rgb(var(--menu-color)) 0%,
            rgba(var(--menu-color),0.45) 45%,
            transparent 90%);
    }

    @keyframes MetaPop {
        from { opacity: 0; transform: translateX(-.4vw) scale(.99); }
        to   { opacity: 1; transform: translateX(0) scale(1); }
    }

    .PWrapper .Metadata .Title {
        display: flex; width: 100%;
        justify-content: flex-start; align-items: center; gap: .4vw;
        padding-bottom: .5vw;
    }

    /* small status dot before the name */
    .PWrapper .Metadata .Title::before {
        content: ""; flex: 0 0 auto;
        width: .32vw; height: .32vw; border-radius: 50%;
        background: rgb(var(--menu-color));
        box-shadow: 0 0 .35vw rgba(var(--menu-color),0.7);
    }

    .PWrapper .Metadata .Title span {
        display: block; flex: 1 1 auto;
        white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 600; font-size: .72vw;
        letter-spacing: .01vw;
        text-align: left;
        color: #fff;
        line-height: 1;
        transform: translateY(var(--text-nudge));
    }

    .PWrapper .Metadata .Line {
        width: 100%; height: .06vw;
        background: linear-gradient(90deg,
            transparent 0%, rgba(var(--menu-color),0.35) 15%,
            rgba(255,255,255,0.08) 85%, transparent 100%);
    }

    .PWrapper .Metadata .Values {
        display: flex; width: 100%;
        flex-direction: column;
        padding-top: .3vw;
    }

    .PWrapper .Metadata .Values .Value {
        position: relative; display: flex; width: 100%;
        justify-content: space-between; align-items: center;
        padding: .24vw .1vw;
        border-radius: calc(var(--menu-radius) * .8);
        transition: background .12s ease;
    }

    .PWrapper .Metadata .Values .Value + .Value {
        border-top: .06vw solid rgba(255,255,255,0.035);
    }

    .PWrapper .Metadata .Values .Value:hover {
        background: rgba(var(--menu-color),0.1);
        border-top-color: transparent;
    }

    .PWrapper .Metadata .Values .Value .Key {
        font-weight: 450; font-size: .56vw;
        letter-spacing: .04vw;
        color: rgba(255,255,255,0.48);
        text-transform: uppercase;
        line-height: 1;
        transform: translateY(var(--text-nudge));
    }

    .PWrapper .Metadata .Values .Value .Val {
        position: static;
        display: flex; align-items: center; gap: .4vw;
    }

    .PWrapper .Metadata .Values .Value .Val span {
        font-weight: 500; font-size: .6vw;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        transform: translateY(var(--text-nudge));
    }

    /* slim vertical health/armour gauge (fill height set inline as value%) */
    .PWrapper .Metadata .Values .Value .Val .Status {
        position: relative;
        width: .3vw; height: .82vw;
        background: rgba(0,0,0,0.55);
        border-radius: .2vw;
        overflow: hidden;
        box-shadow: inset 0 0 0 .06vw rgba(255,255,255,0.06);
    }

    .PWrapper .Metadata .Values .Value .Val .Status .Progress {
        position: absolute; left: 0; right: 0; bottom: 0;
        width: 100%;
        border-radius: .2vw;
        box-shadow: 0 0 .25vw currentColor;
        transition: height .3s cubic-bezier(.22,.8,.3,1);
    }

    .PWrapper .PFooter {
        position: relative; display: flex;
        align-items: center; justify-content: space-between;
        width: 100%; height: 1.3vw;
        margin: .08vw 0 0 0;
        padding: 0 .6vw 0 .45vw;
        background: rgba(0,0,0,0.7);
        border-radius: calc(var(--menu-radius) * .7);
        border: .06vw solid var(--menu-border);
        overflow: hidden;
        box-sizing: border-box;
    }

    .PWrapper .PFooter img {
        position: absolute; left: .45vw;
        width: .9vw; opacity: .9;
    }

    .PWrapper .PFooter .PBuild {
        position: relative; left: auto; top: auto;
        display: flex;
        align-items: center;
        height: 100%;
        font-size: .55vw; font-weight: 450;
        letter-spacing: .04vw;
        line-height: 1;
        color: var(--text-secondary);
        transform: none;
        flex: 0 0 auto;
    }

    .PWrapper .PFooter .PIndicator {
        position: relative; right: auto; top: auto;
        display: flex;
        align-items: center;
        height: 100%;
        font-size: .55vw; font-weight: 400;
        line-height: 1;
        color: var(--text-secondary);
        transform: none;
        flex: 0 0 auto;
        margin-left: auto;
    }



/* NOTIFICATIONS — quiet top-right stack (menu chrome, no toast clichés) */
.NotificationsWrapper {
    position: fixed;
    top: 1.5vw;
    right: 1.5vw;
    bottom: auto;
    left: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: .4vw;
    z-index: 10000;
    pointer-events: none;
    font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    width: 16.5vw;
    max-width: 340px;
}

.Notification {
    --n-accent: rgb(var(--menu-color));
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: .48vw;
    width: auto;
    max-width: 100%;
    min-width: 11vw;
    box-sizing: border-box;
    pointer-events: none;
    padding: .52vw .68vw .52vw .58vw;
    background: rgba(10, 11, 14, 0.94);
    border: .05vw solid rgba(255,255,255,0.07);
    border-radius: .2vw;
    box-shadow: 0 .12vw .42vw rgba(0,0,0,0.42);
    opacity: 0;
    transform: translateX(.35vw);
    transition: opacity .14s ease, transform .16s ease;
}

.Notification.success { --n-accent: #6d9b7c; }
.Notification.error { --n-accent: #b07070; }

.Notification.enter {
    opacity: 1;
    transform: translateX(0);
}

.Notification.exit {
    opacity: 0;
    transform: translateX(.25vw);
}

.NotificationMark {
    flex: 0 0 auto;
    width: .3vw;
    height: .3vw;
    margin-top: .28vw;
    border-radius: 50%;
    background: var(--n-accent);
}

.NotificationContent {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: .14vw;
}

.NotificationTitle {
    display: block;
    font-size: .68vw;
    font-weight: 550;
    letter-spacing: .01vw;
    text-transform: none;
    color: rgba(255,255,255,0.9);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.NotificationBody {
    display: block;
    margin: 0;
    padding: 0;
    font-size: .58vw;
    font-weight: 400;
    color: rgba(255,255,255,0.46);
    line-height: 1.35;
    word-break: break-word;
}

.Notification.solo .NotificationBody {
    display: none;
}

.NotificationProgress { display: none !important; }


.Overlay {
    position: absolute; display: flex;
    width: 100%; height: 100%;
    background: radial-gradient(120% 120% at 50% 45%, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.72) 100%);
    animation: OverlayFade .18s ease both;
}

@keyframes OverlayFade { from { opacity: 0; } to { opacity: 1; } }

.InputWrapper {
    position: absolute; display: flex;
    left: 50%; bottom: 8vw;
    width: 24vw; height: auto;
    transform: translate(-50%);
    justify-content: center; align-items: stretch;
    flex-direction: column;
    background:
        linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 22%),
        linear-gradient(180deg, rgba(20,22,30,0.97) 0%, rgba(10,11,15,0.97) 100%);
    font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    border-radius: calc(var(--menu-radius) * 1.6);
    border: .06vw solid rgba(var(--menu-color),0.28);
    box-shadow:
        0 .6vw 2vw rgba(0,0,0,0.6),
        0 0 0 .06vw rgba(0,0,0,0.4),
        inset 0 .06vw 0 rgba(255,255,255,0.05);
    overflow: hidden;
    animation: InputPop .2s cubic-bezier(.2,.8,.3,1) both;
}

/* top accent line, fading outward */
.InputWrapper::before {
    content: ""; position: absolute;
    left: 0; right: 0; top: 0; height: .1vw;
    background: linear-gradient(90deg, transparent, rgb(var(--menu-color)) 50%, transparent);
    opacity: .85;
}

@keyframes InputPop {
    from { opacity: 0; transform: translate(-50%, .5vw) scale(.98); }
    to   { opacity: 1; transform: translate(-50%, 0) scale(1); }
}

.InputWrapper .Header {
    display: flex; width: 100%; height: 1.5vw;
    justify-content: flex-start; align-items: center;
    gap: .3vw;
    border-bottom: .06vw solid rgba(255,255,255,0.06);
    font-size: .6vw; font-weight: 550;
    letter-spacing: .06vw; text-transform: uppercase;
    color: var(--text-primary);
    padding: 0 .7vw;
}

/* keyboard glyph before the title */
.InputWrapper .Header::before {
    content: "\2328"; /* keyboard symbol */
    font-size: .8vw; line-height: 1;
    color: rgb(var(--menu-color));
    text-shadow: 0 0 .4vw rgba(var(--menu-color),0.5);
}

.InputWrapper .Header img {
    width: 1.4vw; height: 1.2vw;
}

.InputWrapper .Header .Line {
    width: .05vw; height: .75vw;
    background: rgba(255,255,255,0.15);
}

.InputWrapper .Header i { margin-left: .3vw; }

.InputWrapper .Body {
    display: flex; width: 100%;
    justify-content: center; align-items: center;
    padding: .6vw;
    font-size: .6vw; color: var(--text-primary);
}

.InputWrapper .Body .InsideCon {
    position: relative; display: flex;
    width: 100%; min-height: 1.7vw;
    background: rgba(0,0,0,0.45);
    border: .06vw solid rgba(var(--menu-color),0.22);
    border-radius: calc(var(--menu-radius) * 1.1);
    box-shadow: inset 0 0 .5vw rgba(0,0,0,0.5), inset 0 0 0 .06vw rgba(255,255,255,0.02);
    justify-content: flex-start; align-items: center;
    padding: 0 .55vw;
}

.InputWrapper .Body .InsideCon span {
    font-weight: 500; font-size: .62vw;
    letter-spacing: .01vw;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    transform: translateY(var(--text-nudge));
}

.InputWrapper .Body .InsideCon span::after {
    content: ""; display: inline-block;
    width: .08vw; height: .7vw;
    vertical-align: middle;
    background: rgb(var(--menu-color));
    box-shadow: 0 0 .3vw rgba(var(--menu-color),0.7);
    margin-left: .15vw;
    animation: blink 1.05s steps(2,start) infinite;
}

@keyframes blink { to { visibility: hidden; } }

/* Shared Eshay HUD list chrome (blue via --menu-color) */
.KBLWrapper, .SBLWrapper {
    position: absolute; display: none;
    width: var(--hud-panel-w);
    flex-direction: column;
    font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    font-optical-sizing: auto;
    border-radius: var(--menu-radius);
    border: .06vw solid var(--menu-border);
    background: rgba(12,13,17,0.92);
    box-shadow: none;
    overflow: hidden;
    z-index: 8;
}
.SBLWrapper {
    left: var(--hud-dock-left);
    top: var(--hud-dock-top);
    right: auto;
}
.KBLWrapper {
    left: calc(var(--hud-dock-left) + var(--hud-panel-w) + var(--hud-dock-gap));
    top: var(--hud-dock-top);
    right: auto;
}
/* When spectators are hidden, keep keybinds flush to the top-left dock */
.KBLWrapper.solo {
    left: var(--hud-dock-left);
}
.KBLWrapper.show, .SBLWrapper.show { display: flex !important; }

.KBLWrapper .Header, .SBLWrapper .Header {
    display: flex; width: 100%; height: 1.35vw;
    align-items: center;
    gap: .3vw;
    padding: 0 .55vw;
    border-bottom: .06vw solid var(--menu-border);
    background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
}
.KBLWrapper .Header .Icon, .SBLWrapper .Header .Icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: .7vw; height: .7vw;
    color: rgb(var(--menu-color));
    flex-shrink: 0;
}
.KBLWrapper .Header .Icon svg, .SBLWrapper .Header .Icon svg {
    width: .55vw; height: .55vw; display: block;
}
.KBLWrapper .Header .Icon { font-size: .55vw; }
.KBLWrapper .Header span, .SBLWrapper .Header span {
    font-size: .52vw; font-weight: 600;
    letter-spacing: .055vw;
    text-transform: uppercase;
    color: var(--text-primary);
    line-height: 1;
    display: flex;
    align-items: center;
}

.KBLWrapper .Keybinds, .SBLWrapper .Spectators {
    display: flex; width: 100%;
    flex-direction: column;
    padding: .26vw .55vw;
    max-height: 16vw; overflow: auto;
}

.KBLWrapper .Keybinds .Keybind,
.SBLWrapper .Spectators .Spectator {
    display: flex; width: 100%; min-height: .9vw;
    justify-content: space-between; align-items: center;
    gap: .35vw;
    padding: .18vw 0;
    position: relative;
}

.KBLWrapper .Keybinds .Keybind .Label,
.SBLWrapper .Spectators .Spectator .Label {
    position: static;
    display: flex;
    align-items: center;
    font-size: .52vw; font-weight: 450;
    color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0; flex: 1;
    line-height: 1;
}

.KBLWrapper .Keybinds .Keybind .Elements,
.SBLWrapper .Spectators .Spectator .Elements {
    position: static;
    display: flex; align-items: center; gap: .3vw;
    flex: 0 0 auto;
}

.KBLWrapper .Keybinds .Keybind .Elements .Key,
.SBLWrapper .Spectators .Spectator .Elements .Key {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: .82vw; height: .75vw;
    padding: 0 .22vw;
    font-size: .46vw; font-weight: 600;
    line-height: 1;
    color: var(--text-primary);
    background: rgba(255,255,255,0.06);
    border: .06vw solid var(--menu-border);
    border-bottom-width: .12vw;
    border-radius: .13vw;
    box-sizing: border-box;
}

.KBLWrapper .Keybinds .Keybind .Elements .State {
    font-size: .48vw; font-weight: 600;
    letter-spacing: .02vw;
    min-width: .9vw; text-align: right;
    line-height: 1;
    display: flex;
    align-items: center;
}
.KBLWrapper .Keybinds .Keybind .Elements .State.On { color: rgb(var(--menu-color)); }
.KBLWrapper .Keybinds .Keybind .Elements .State.Off { color: var(--text-secondary); }

.SBLWrapper .Spectators .Spectator .Elements .State {
    font-size: .48vw; font-weight: 600;
    letter-spacing: .02vw;
    min-width: .9vw; text-align: right;
    color: var(--text-secondary);
    white-space: nowrap;
    line-height: 1;
    display: flex;
    align-items: center;
}

.KBLWrapper .empty, .SBLWrapper .empty {
    padding: .45vw 0; font-size: .5vw; font-weight: 400;
    color: var(--text-secondary); text-align: center;
    line-height: 1.2;
    display: flex; align-items: center; justify-content: center;
}

html,body{height:100%;width:100%;margin:0;padding:0;overflow:hidden;background:transparent;}
:root{
  --w:19.0104vw;
  --hud-dock-left:1vw;
  --hud-dock-top:1vw;
  --hud-panel-w:7.5vw;
  --hud-notify-w:11vw;
  --hud-dock-gap:.35vw;
  --hud-x:14px;--hud-y:14px;--hud-w:198px;--hud-gap:10px;
  --kb-x:14px;--kb-y:14px;--kb-w:198px;
  --r:.35vw;--row:1.6vw;--footer-h:1.3vw;
  --bg:#000;
  --accent:#1689d4;
  --accent-dim:rgba(22,137,212,.14);
  --accent-glow:rgba(22,137,212,.28);
  --accent-drop:rgba(22,137,212,.11);
  --accent-rail:rgba(22,137,212,.95);
  --accent-border:rgba(22,137,212,.34);
  --accent-menu-shadow:rgba(22,137,212,.06);
  --accent-row-inset:rgba(22,137,212,.88);
  --accent-row-glow:rgba(22,137,212,.08);
  --accent-switch-border:rgba(22,137,212,.68);
  --accent-slider-from:#0a6a9c;
  --accent-footer-shadow:rgba(22,137,212,.1);
  --accent-panel-border:rgba(22,137,212,.38);
  --accent-panel-shadow:rgba(22,137,212,.08);
  --accent-input-border:rgba(22,137,212,.4);
  --accent-hud-border:rgba(22,137,212,.26);
  --accent-icon-bg:rgba(22,137,212,.14);
  --accent-icon-border:rgba(22,137,212,.4);
}
html[data-theme="blue"]{--menu-color:22, 137, 212;}
html[data-theme="green"]{--menu-color:19, 95, 27;}
html[data-theme="savage"]{--menu-color:254, 242, 5;}
html[data-theme="baxci"]{--menu-color:87, 191, 242;}
.PWrapper{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility 0s linear .18s;}
.PWrapper.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .18s ease,visibility 0s linear 0s;}
.PWrapper.input-hidden{opacity:0!important;visibility:hidden!important;pointer-events:none!important;}
.PWrapper.color-picker-open{opacity:.72;pointer-events:none;}
.PWrapper.gun-picker-open{opacity:.88;}
/* INDEX_POS_LOCK */
.PWrapper:not(.keybind-mode){left:var(--menu-x)!important;top:var(--menu-y)!important;width:19.0104vw!important;transform:translate(0%,0%) scale(calc(var(--menu-scale)*var(--resolution-scale)))!important;transform-origin:top left!important;align-items:stretch!important;}
.PWrapper:not(.keybind-mode) .PElements,.PWrapper:not(.keybind-mode) .PRightElements{width:100%!important;max-width:100%!important;box-sizing:border-box!important;}
.PWrapper:not(.keybind-mode) .PBanner,.PWrapper:not(.keybind-mode) .PCategories,.PWrapper:not(.keybind-mode) .PTabs,.PWrapper:not(.keybind-mode) .PFooter{width:100%!important;max-width:100%!important;margin-left:0!important;margin-right:0!important;box-sizing:border-box!important;}
.PWrapper .PCategories:empty,.PWrapper .PCategories:not(.show){display:none;}
.PWrapper .PCategories.show{display:flex;}
/* List scroll and selection bubble share a curve/duration, otherwise crossing a scroll
   boundary glides the rows at one speed and snaps the highlight at another. */
.PWrapper.fast-nav #list{transition:transform .12s cubic-bezier(.22,1,.36,1)!important;}.PWrapper.fast-nav #selOverlay{transition:top .12s cubic-bezier(.22,1,.36,1)!important;}
/* Full rebuilds (tab switches) must not animate in from the old scroll offset. */
.PWrapper.rendering #list{transition:none!important;}.PWrapper.rendering #selOverlay{transition:none!important;}
#list{position:relative;z-index:2;width:100%;transition:transform .2s cubic-bezier(.22,1,.36,1);}
/* Row icons/labels are centered in the main PTabs block (same math as chevrons). */
.PTab.active .PTLabel > .fa-solid,
.PTab.active .PTLabel .ico,
.PTab.active .PTLabel .ico .fa-solid,
.PTab:hover .PTLabel > .fa-solid,
.PTab:hover .PTLabel .ico{
  color:rgba(255,255,255,.72) !important;
}
.PTab > .ico{ display:none !important; }
.Desc{display:none;}
.Desc.show{display:flex!important;opacity:1;}
/* ===== KEYBIND CAPTURE (matches spectate / keybind HUD / main UI) ===== */
.PWrapper.keybind-mode .PScroll,
.PWrapper.keybind-mode .PCategories,
.PWrapper.keybind-mode .list-section-header,
.PWrapper.keybind-mode #list,
.PWrapper.keybind-mode #selOverlay,
.PWrapper.keybind-mode .Metadata,
.PWrapper.keybind-mode .PBanner,
.PWrapper.keybind-mode .PFooter{
  display:none !important;
}
.PWrapper.keybind-mode{

  function iconSvgHtml(key){ return (typeof ICONS!=='undefined' && (ICONS[key]||ICONS.dot)) || ''; }

  // Action rows (saved configs: Load/Update/Delete, keybinds: Rebind/Delete) are cycled with
  // left/right exactly like Choice rows, so they get the same "- value -" chip. Rendering a
  // filled bar for them was meaningless — the value is an action name, not a magnitude.
  function isActionRow(r){ return !!(r && r.sliderStyle==='actions'); }
  function isChoiceLikeRow(r){ return !!(r && (r.sliderMode==='Choice' || isActionRow(r))); }
  function choiceChipText(r){
    if(!r) return '?';
    if(r.sliderText!=null) return String(r.sliderText);
    // Action rows carry the current action in sliderMode; they never set sliderText.
    if(isActionRow(r) && r.sliderMode!=null) return String(r.sliderMode);
    return '?';
  }

  function buildRow(r, i, activeIdx){
    const tab=document.createElement('div');
    const isActive = i===activeIdx;
    tab.className='PTab'+(isActive?' active':'');
    if(r.redRow) tab.classList.add('red-row');
    tab.dataset.idx=String(i);

    const kind = r.kind || 'button';
    if(kind==='label' || r.menuSectionHeader || r.menuSectionTitle){
      if(r.menuSectionHeader) tab.classList.add('is-header');
      if(r.menuSectionTitle) tab.classList.add('is-section');
      const div=document.createElement('div'); div.className='Divider';
      div.innerHTML='<div class="Left"></div><span class="Label"></span><div class="Right"></div>';
      div.querySelector('.Label').textContent=esc(r.label||'');
      tab.appendChild(div);
      tab.addEventListener('mousedown', function(ev){
        ev.preventDefault();
        if(window.__staticColorPickerActive || window.__staticGunPickerActive) return;
        window.__staticMenuAction=String(i+1);
      });
      return tab;
    }

    const lab=document.createElement('span'); lab.className='PTLabel';
    // Sizing/placement lives in the `.PTLabel > .fa-solid` rule. Setting display inline
    // here used to beat the stylesheet's inline-flex and kill the glyph centring.
    if(kind==='category' && r.icon){
      const fa=FA_ICON_MAP[r.icon];
      if(fa){
        const i=document.createElement('i');
        i.className='fa-solid '+fa;
        lab.appendChild(i);
      } else {
        const ico=document.createElement('span');
        ico.className='ico';
        ico.innerHTML=iconSvgHtml(r.icon);
        lab.appendChild(ico);
      }
    }
    let labelText = esc(r.label||'');
    if(kind==='slider' && isActive && !isChoiceLikeRow(r)){
      labelText = labelText + ': ' + esc(r.sliderText!=null?r.sliderText:(r.sliderValue!=null?r.sliderValue:''));
    }
    const txt=document.createElement('span'); txt.className='PTText'; txt.textContent=labelText; lab.appendChild(txt);
    tab.appendChild(lab);

    if(kind==='toggle'){
      if(r.sliderMode==='Choice'){
        const sc=document.createElement('div'); sc.className='Scrollable with-checkbox';
        const l=document.createElement('span'); l.textContent='-';
        const m=document.createElement('span'); m.textContent=choiceChipText(r);
        const rr=document.createElement('span'); rr.textContent='-';
        sc.appendChild(l); sc.appendChild(m); sc.appendChild(rr);
        tab.appendChild(sc);
      }
      const c=document.createElement('div'); c.className='Checkbox'+(r.on?' Checked':'');
      c.innerHTML='<div class="Inside"></div>'; tab.appendChild(c);
    } else if(kind==='slider'){
      if(isChoiceLikeRow(r)){
        const sc=document.createElement('div'); sc.className='Scrollable';
        const l=document.createElement('span'); l.textContent='-';
        const m=document.createElement('span'); m.textContent=choiceChipText(r);
        const rr=document.createElement('span'); rr.textContent='-';
        sc.appendChild(l); sc.appendChild(m); sc.appendChild(rr);
        tab.appendChild(sc);
      } else {
        const sl=document.createElement('div'); sl.className='Slider';
        const min=Number(r.sliderMin||0), max=Number(r.sliderMax||100), v=Number(r.sliderValue||min);
        const pct=Math.max(0,Math.min(100, max===min?0:((v-min)/(max-min))*100));
        sl.innerHTML='<div class="Progress" style="width:'+pct+'%"><div class="Thumb"></div></div>';
        tab.appendChild(sl);
      }
    } else if(kind==='category'){
      const ch=document.createElement('span');
      ch.className='chev-right';
      ch.textContent='›';
      tab.appendChild(ch);
    }

    tab.addEventListener('mousedown', function(ev){
      ev.preventDefault();
      if(window.__staticColorPickerActive || window.__staticGunPickerActive) return;
      window.__staticMenuAction=String(Number(tab.dataset.idx)+1);
    });
    return tab;
  }

  function rowHeightPx(){ return window.innerWidth * (ROW_H_VW / 100); }

  // Real distance between row tops. Borders/padding make this larger than ROW_H_VW, and
  // that gap multiplies by the scroll offset — which is what pushed the last rows of a
  // full tab below the panel and left half-rows clipped at the top and bottom edges.
  function rowPitchPx(){
    if(list && list.children.length >= 2){
      const d = (list.children[1].offsetTop || 0) - (list.children[0].offsetTop || 0);
      if(d > 0.5) return d;
    }
    if(list && list.children.length && list.children[0].offsetHeight){
      return list.children[0].offsetHeight;
    }
    return rowHeightPx();
  }

  // How far #list is currently translated up, in px. Recorded wherever the transform is
  // set, because the virtualized path mounts a window of rows and never translates.
  function setListShift(scrollOffset, translated){
    const shift = translated ? Math.max(0, scrollOffset || 0) * rowPitchPx() : 0;
    window.__staticListShiftPx = shift;
    if(list) list.style.transform = shift > 0 ? ('translateY(-' + shift + 'px)') : 'translateY(0)';
  }

  function calcScrollOffset(idx, total, maxVis){
    if(total<=maxVis) return 0;
    const half=Math.floor(maxVis/2);
    let off=idx-half;
    if(off<0) off=0;
    if(off>total-maxVis) off=total-maxVis;
    return off;
  }

  function findRowEl(idx){
    if(!list) return null;
    const want=String(idx);
    for(let i=0;i<list.children.length;i++){
      const el=list.children[i];
      if(el && el.dataset && el.dataset.idx===want) return el;
    }
    return null;
  }

  function listScrollTransform(scrollOffset){
    const off = Math.max(0, Number(scrollOffset) || 0);
    if(off <= 0) return 'translateY(0)';
    return 'translateY(-' + (off * rowPitchPx()) + 'px)';
  }

  function updateHighlight(idx, scrollOffset){
    if(!selOverlay || !list) return;
    const row = findRowEl(idx) || list.children[idx];
    if(!row){
      selOverlay.style.opacity='0';
      return;
    }
    const color = row.classList.contains('red-row') ? '229, 72, 72' : menuColor();
    // Eshay1: offsetTop, not getBoundingClientRect (avoids in-flight transform = visual jump).
    const rowH = (list.children[0] && list.children[0].offsetHeight) || row.offsetHeight || 0;
    const scrollPx = window.__staticListShiftPx != null
      ? Math.max(0, window.__staticListShiftPx)
      : Math.max(0, (scrollOffset||0) * rowH);
    let topPx = Math.max(0, (row.offsetTop||0) - scrollPx);
    let hPx = row.offsetHeight || rowH || 1;
    const maxH = listWrap ? Math.max(0, listWrap.clientHeight) : 0;
    if(listWrap){
      if(topPx + hPx > maxH){
        hPx = Math.max(1, maxH - topPx);
      }
      if(topPx > maxH) topPx = Math.max(0, maxH - hPx);
    }
    // First/last visible row: square the flush edge so blue fills the panel
    // (parent overflow+radius clips it). Mid rows keep the bubble radius.
    const edgeTol = 1;
    const atTop = topPx <= edgeTol;
    const atBot = maxH > 0 && (topPx + hPx >= maxH - edgeTol);
    const rMid = '.3083vw';
    const rTop = atTop ? '0' : rMid;
    const rBot = atBot ? '0' : rMid;
    if(atTop) topPx = 0;
    selOverlay.style.top = topPx + 'px';
    selOverlay.style.height = hPx + 'px';
    selOverlay.style.width = '100%';
    selOverlay.style.left = '0';
    selOverlay.style.right = 'auto';
    selOverlay.style.opacity = '1';
    selOverlay.style.zIndex = '0';
    selOverlay.style.pointerEvents = 'none';
    selOverlay.style.backgroundColor = 'rgba('+color+', 0.55)';
    selOverlay.style.border = '0.04vw solid rgba('+color+', 0.95)';
    // Keep radius on all edges — squaring the top row looked broken on tab entry.
    selOverlay.style.borderRadius = rMid;
    selOverlay.style.boxShadow = '0vw 0vw .18vw .02vw rgba('+color+',0.85)';
    selOverlay.style.transition = 'top 200ms ease, height 120ms ease, border-radius 120ms ease';
  }

  // Index scrollbar math (14.0625 / 1.5625 visible rows) — Eshay1.
  function updateScrollBar(scrollOffset, total, maxVis, activeIdx, rowList){
    if(!psProgress) return;
    const rail = document.getElementById('pScroll');
    if(rail){
      rail.style.top = '';
      rail.style.height = '';
      rail.style.bottom = '';
    }
    const rows = rowList || [];
    const I = Math.max(1, Number(maxVis) || Math.floor(14.0625 / 1.5625));
    const countable = [];
    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      if(!r || r.kind === 'label' || r.menuSectionTitle || r.menuSectionHeader) continue;
      countable.push(r);
    }
    const K = countable.length > 0 ? countable.length : Math.max(0, Number(total) || rows.length || 0);
    let S = 0;
    if(countable.length > 0){
      const ai = Math.max(0, Math.min(Number(activeIdx) || 0, Math.max(rows.length - 1, 0)));
      const active = rows[ai];
      const found = countable.indexOf(active);
      if(found >= 0) S = found;
      else {
        for(let i = ai; i >= 0; i--){
          const f = countable.indexOf(rows[i]);
          if(f >= 0){ S = f; break; }
        }
      }
    } else {
      S = Math.max(0, Number(activeIdx) || 0);
    }
    if(K <= I){
      psProgress.style.height = '100%';
      psProgress.style.top = '0%';
      return;
    }
    const F = (I / K) * 100;
    const te = (S / Math.max(K - 1, 1)) * (100 - F);
    psProgress.style.height = F + '%';
    psProgress.style.top = te + '%';
  }

  function setDesc(text){
    if(!descBox) return;
    const t=(text||'').trim();
    // Footer already shows (n/m) — never float pure counters like 10/10
    const counterOnly = /^[\(\s]*\d+\s*\/\s*\d+[\)\s]*$/.test(t);
    if(!t || counterOnly){
      descBox.classList.remove('show');
      descBox.style.display='none';
      return;
    }
    if(descText) descText.textContent=t;
    descBox.style.display='flex';
    descBox.classList.add('show');
  }

  function isCountedRow(r){
    return !!(r && r.kind!=='label' && !r.menuSectionHeader && !r.menuSectionTitle);
  }
  function selectablePos(rows, activeIdx){
    let total=0, pos=0, last=0;
    for(let i=0;i<rows.length;i++){
      if(!isCountedRow(rows[i])) continue;
      total++;
      if(i===activeIdx) pos=total;
      else if(i<activeIdx) last=total;
    }
    if(!total) return {pos:0, total:0};
    if(!pos) pos=last||1;
    return {pos:pos, total:total};
  }
  function isChoiceAdjustRow(r){
    if(!r) return false;
    const mode = r.sliderMode || r.mode;
    if(mode === 'Choice') return true;
    if(r.sliderStyle === 'actions') return true;
    return false;
  }
  function formatFootCount(rows, activeIdx){
    // Choice / actions adjusters: show this option's index/count, not tab row count.
    const r = rows && rows[activeIdx];
    if(isChoiceAdjustRow(r) && (r.sliderMin!=null || r.sliderMax!=null || r.sliderValue!=null)){
      const min = Number(r.sliderMin!=null ? r.sliderMin : 0);
      const max = Number(r.sliderMax!=null ? r.sliderMax : min);
      const v = Number(r.sliderValue!=null ? r.sliderValue : min);
      const total = Math.max(1, Math.round(max - min) + 1);
      let pos = Math.round(v - min) + 1;
      if(pos < 1) pos = 1;
      if(pos > total) pos = total;
      return '('+pos+'/'+total+')';
    }
    const m=selectablePos(rows, activeIdx);
    return '('+m.pos+'/'+Math.max(m.total,1)+')';
  }

  const NOTIFY_ICONS={};

  function notifyKindClass(kind, title, message){
    const k=String(kind||'').toLowerCase();
    if(k==='success'||k==='ok') return 'success';
    if(k==='error'||k==='fail'||k==='failed') return 'error';
    const blob=(String(title||'')+' '+String(message||'')).toLowerCase();
    if(/\b(fail|failed|error|denied|invalid|blocked|injection failed)\b/.test(blob)) return 'error';
    if(/\b(success|complete|completed|saved|loaded|applied|enabled|disabled|copied|added|deleted|updated|\bon\b)\b/.test(blob)) return 'success';
    return 'info';
  }

  window.staticNotify=function(opts){
    opts=opts||{};
    const wrap=document.getElementById('notifyWrap');
    if(!wrap) return false;
    const title=String(opts.title||'Notice');
    const message=String(opts.message||'');
    const kind=notifyKindClass(opts.kind, title, message);
    const duration=Math.max(1800, Number(opts.duration)||3400);
    const MAX_TOASTS=3;

    const existing=[].slice.call(wrap.querySelectorAll('.Notification:not(.exit)'));
    for(let i=0;i<existing.length;i++){
      const t=existing[i].querySelector('.NotificationTitle');
      if(t && t.textContent===title){
        existing[i].classList.remove('enter');
        existing[i].classList.add('exit');
        setTimeout(function(node){ if(node && node.parentNode) node.parentNode.removeChild(node); }, 200, existing[i]);
      }
    }
    while(wrap.querySelectorAll('.Notification:not(.exit)').length>=MAX_TOASTS){
      const oldest=wrap.querySelector('.Notification:not(.exit)');
      if(!oldest) break;
      oldest.classList.remove('enter');
      oldest.classList.add('exit');
      setTimeout(function(node){ if(node && node.parentNode) node.parentNode.removeChild(node); }, 200, oldest);
    }

    const el=document.createElement('div');
    el.className='Notification '+kind+(message?'':' solo');

    const mark=document.createElement('span');
    mark.className='NotificationMark';
    mark.setAttribute('aria-hidden','true');
    el.appendChild(mark);

    const content=document.createElement('div');
    content.className='NotificationContent';

    const titleEl=document.createElement('span');
    titleEl.className='NotificationTitle';
    titleEl.textContent=title;
    content.appendChild(titleEl);

    if(message){
      const body=document.createElement('div');
      body.className='NotificationBody';
      body.textContent=message;
      content.appendChild(body);
    }

    el.appendChild(content);
    wrap.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('enter'); });
    setTimeout(function(){
      el.classList.remove('enter');
      el.classList.add('exit');
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 180);
    }, duration);
    return true;
  };

  function renderSpectatorList(show, items){
    if(!spDisplay) return;
    spDisplay.classList.toggle('show', !!show);
    if(!show || !spDisplayList) return;
    spDisplayList.innerHTML='';
    const list = Array.isArray(items) ? items : [];
    if(!list.length){
      const empty=document.createElement('div');
      empty.className='empty';
      empty.textContent='No spectators';
      spDisplayList.appendChild(empty);
      return;
    }
    list.forEach(function(item){
      const row=document.createElement('div'); row.className='Spectator';
      const name=document.createElement('div'); name.className='Label'; name.textContent=item.name||item.label||'Unknown';
      const els=document.createElement('div'); els.className='Elements';
      const id=document.createElement('div'); id.className='Key'; id.textContent=item.id||'?';
      els.appendChild(id);
      const d=item.dist!=null?String(item.dist):'';
      if(d){
        const meta=document.createElement('div'); meta.className='State Off';
        meta.textContent=d.indexOf('m')>=0?d:(d+'m');
        els.appendChild(meta);
      }
      row.appendChild(name); row.appendChild(els);
      spDisplayList.appendChild(row);
    });
  }

  function renderKeybindList(show, items){
    if(!kbDisplay) return;
    kbDisplay.classList.toggle('show', !!show);

    kbDisplayList.innerHTML='';
    const list = Array.isArray(items) ? items : [];

      kbDisplayList.appendChild(empty);

      const name=document.createElement('div'); name.className='Label'; name.textContent=item.label||'';

  function renderPlayerInfoPanel(info, open){
    if(!piDisplay || !piList || !piName) return;

      piDisplay.classList.add('show');
      piName.textContent = info.name || 'Player';
      const rows = [
        {key:'Distance', value:(info.dist != null ? Number(info.dist).toFixed(1) + 'm' : '—')},
        {key:'Server ID', value:String(info.sid != null ? info.sid : '—')},
        {key:'Health', value:String(info.health != null ? info.health : 0), color:'0, 255, 17', pct:Math.max(0, Math.min(100, Number(info.health)||0))},
        {key:'Armour', value:String(info.armor != null ? info.armor : 0), color:'0, 132, 255', pct:Math.max(0, Math.min(100, Number(info.armor)||0))},
        {key:'Weapon', value:String(info.weapon || 'Unknown'), warn: !!(info.weapon && info.weapon !== 'Unarmed' && info.weapon !== 'Unknown')},
        {key:'Vehicle', value:String(info.vehicle || 'None')},
        {key:'Alive', value:(info.alive ? 'Alive' : 'Dead'), warn:!info.alive},
        {key:'Speed', value:(info.speed != null ? Number(info.speed).toFixed(1) + ' km/h' : '0.0 km/h')},
        {key:'Visible', value:info.visible ? 'Yes' : 'No'},

        row.appendChild(key);

  function applyListHeight(rowCount, maxVis, isKeybind, isMain){
    if(!listWrap) return;
    if(isKeybind){
      listWrap.style.height='auto';
      listWrap.style.maxHeight='none';
      listWrap.style.minHeight='0';
      listWrap.style.overflow='visible';
      listWrap.style.padding='0';
      return;
    }
    const vis=Math.max(Math.min(rowCount, maxVis), rowCount>0?1:0);
    // Whole-row height + tiny pad so the selection bubble isn't clipped.
    const pitch = rowPitchPx();
    const slack = window.innerWidth * (0.04 / 100);
    listWrap.style.height=(vis*pitch + slack)+'px';
    listWrap.style.maxHeight = isMain
      ? 'none'
      : (Math.max(window.innerWidth * (MAX_H_VW/100), INSIDE_VISIBLE_ROWS*pitch) + slack)+'px';
    listWrap.style.overflow='hidden';
  }

  const ROW_OVERSCAN = 3;
  const VIRT_THRESHOLD = 120; // keep smooth translateY for typical tabs (incl. Server keybinds)
